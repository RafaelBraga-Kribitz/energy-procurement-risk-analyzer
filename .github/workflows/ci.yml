# EN-080 — CI. Jobs: 1 lint, 2 test, 3 dbt-check (full fixture pipeline:
# dbt → profile → analytics → simulator → SSOT, ADR-018), 4 ssot-check (GV-303
# on the committed README/EXEC_SUMMARY/NUMERIC_SSOT).
# Every job installs exactly the committed uv.lock (EN-030, ADR-012).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      # A-7 / EN-003: the token guard also runs here, so a skipped pre-commit
      # hook cannot land a token literal on main.
      - run: make token-guard
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      # EN-070: no network in CI tests (live suite excluded); EN-071: coverage gate.
      - run: make test

  dbt-check:          # M3 — dbt build against a synthesized fixture warehouse (EN-080 job 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      # ADR-010: network-free synth of the fixture warehouse (fresh checkout,
      # empty data/). --force never touches the committed data/manual CSV.
      - run: uv run python scripts/bootstrap_fixture_warehouse.py --force
      # M4: the real SPEC-03 profile replaces the consumer-load stand-in.
      - run: make profile
      - run: cd dbt && uv run dbt build
      # The schema contract is meaningful only after dbt build (skipped in `test`).
      - run: uv run pytest tests/unit/test_marts_contract.py
      # The build report must run in CI too, not only on a local machine.
      - run: uv run python -m epra.warehouse.report
      # M5: SPEC-04 analytics on the fixture marts, incl. the AN-304 gate.
      - run: make analyze
      # M6: SPEC-05 simulator incl. the ST-602 gate, then the SSOT (GV-302, E-2).
      - run: make simulate
      - run: make ssot

  ssot-check:         # M6 — GV-303 on the COMMITTED docs + SSOT (no regeneration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: make ssot-check
