# SPEC-02 §5 fct_consumer_load_hourly / fct_procurement_cost_monthly
# contracts -- the two marts loaded from Python module outputs (SPEC-03
# LP-003, SPEC-05 ST-001), fed by the ADR-016 stand-in until M4/M6 land.
version: 2

models:
  - name: fct_consumer_load_hourly
    description: >
      SPEC-02 §5 / SG-06 hour-grain consumer-load mart: ts_utc, load_mwh.
      Thin loader over data/processed/consumer_load_hourly.parquet
      (SPEC-03 LP-003) -- stand-in until M4 (ADR-016). Never disabled or
      forked by build-order (SG-06).
    columns:
      - name: ts_utc
        description: UTC hour start, TIMESTAMPTZ (DM-010, ADR-014). Grain key.
        data_tests:
          - unique
          - not_null
      - name: load_mwh
        description: Reference consumer's energy drawn in the hour, MWh (LP-003; CALIBRATED).

  - name: fct_procurement_cost_monthly
    description: >
      SPEC-02 §5 / DM-063 local month x strategy procurement-cost mart:
      year_local, month_local, strategy_id, volume_mwh, cost_eur,
      unit_cost_eur_mwh. Thin loader over
      data/processed/strategy_costs_monthly.parquet (SPEC-05 ST-001) --
      stand-in until M6 (ADR-016). Never disabled or forked by
      build-order (SG-06). Every strategy_id must exist in dim_strategy
      (DM-063).
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [year_local, month_local, strategy_id]
    columns:
      - name: year_local
        description: Europe/Vienna calendar year (DM-012). Grain key.
        data_tests:
          - not_null
      - name: month_local
        description: Europe/Vienna calendar month, 1-12. Grain key.
        data_tests:
          - not_null
      - name: strategy_id
        description: Procurement strategy (FK to dim_strategy, DM-063). Grain key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_strategy')
                field: strategy_id
      - name: volume_mwh
        description: Energy procured in the month, MWh (identical across strategies, SPEC-05 §1).
      - name: cost_eur
        description: Energy cost of the month under the strategy, nominal EUR (excl. grid fees/taxes).
      - name: unit_cost_eur_mwh
        description: cost_eur / volume_mwh, EUR/MWh.
