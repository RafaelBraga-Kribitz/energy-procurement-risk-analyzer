# SPEC-02 (DM-002/003) dbt project: layers, schemas and materializations
# (staging = views, marts = tables). Generic tests use the dbt >= 1.10
# `arguments:` syntax everywhere, hence the version floor (ADR-012).
name: epra
version: "1.0.0"
profile: epra
require-dbt-version: [">=1.10.0", "<2.0.0"]

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

models:
  epra:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

seeds:
  epra:
    dim_strategy:
      +schema: marts
      +column_types:
        strategy_id: varchar
        strategy_name: varchar
        description: varchar
