# DM-002 — committed profile, relative path, no credentials.
# Run dbt from the dbt/ directory (DBT_PROFILES_DIR defaults to cwd there).
#
# settings.TimeZone: DuckDB's session TimeZone defaults to the HOST OS's local
# zone (confirmed live: this machine reports 'Europe/Vienna'), not UTC. Because
# `ts_utc` is TIMESTAMP WITH TIME ZONE, `date_trunc('hour', ts_utc)` truncates
# in whatever the *session* TimeZone is — so without this pin, every staging
# hourly aggregation silently truncates to Vienna-local hour boundaries
# instead of UTC ones (discovered live 04-02: DST-transition hours showed
# n_subhours=8 instead of 4, proving the truncation was TZ-shifted). Pinning
# TimeZone=UTC here, once, for every dbt-duckdb session/cursor is the correct
# fix — not a per-model AT TIME ZONE call, which DM-011 reserves exclusively
# for deriving local calendar attributes (which staging must never do).
epra:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ../data/warehouse/epra.duckdb
      threads: 4
      settings:
        TimeZone: UTC
